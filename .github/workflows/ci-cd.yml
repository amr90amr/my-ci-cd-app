name: CI-CD Pipeline

on:
  push:
    branches:
      - dev
      - test
      - prod

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

    # =========================
    # 1. Checkout code
    # =========================
    - name: Checkout
      uses: actions/checkout@v4

    # =========================
    # 2. Setup kubectl
    # =========================
    - name: Setup kubectl
      uses: azure/setup-kubectl@v4

    # =========================
    # 3. Setup kubeconfig (FIX FOR YOUR ERROR)
    # =========================
    - name: Configure kubeconfig
      run: |
        mkdir -p $HOME/.kube
        echo "${KUBE_CONFIG}" | base64 -d > $HOME/.kube/config
        export KUBECONFIG=$HOME/.kube/config
        kubectl config current-context
      env:
        KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}

    # =========================
    # 4. Verify cluster connection
    # =========================
    - name: Cluster Info
      run: |
        kubectl get nodes
        kubectl cluster-info

    # =========================
    # 5. Deploy DEV
    # =========================
    - name: Deploy DEV
      if: github.ref == 'refs/heads/dev'
      run: kubectl apply --validate=false -f k8s/dev/

    # =========================
    # 6. Deploy TEST
    # =========================
    - name: Deploy TEST
      if: github.ref == 'refs/heads/test'
      run: kubectl apply --validate=false -f k8s/test/

    # =========================
    # 7. Deploy PROD
    # =========================
    - name: Deploy PROD
      if: github.ref == 'refs/heads/prod'
      run: kubectl apply --validate=false -f k8s/prod/







































